<header class="luxury-header">
    <nav class="luxury-nav">
        <div class="luxury-logo">
            <a href="{{ "/" | absURL }}">Nguyễn Trịnh Minh Huy</a>
        </div>

        <ul class="luxury-menu">
            <li>
                <a href="{{ "/" | absURL }}"
                   class="{{ if .IsHome }}active{{ end }}">
                   TRANG CHỦ
                </a>
            </li>

            <li>
                <a href="{{ "about/" | absURL }}"
                   class="{{ if in .RelPermalink "/about/" }}active{{ end }}">
                   GIỚI THIỆU
                </a>
            </li>

            <li>
                <a href="{{ "posts/" | absURL }}"
                   class="{{ if eq .Section "posts" }}active{{ end }}">
                   BLOG
                </a>
            </li>

            <li>
                <a href="{{ "contact/" | absURL }}"
                   class="{{ if in .RelPermalink "/contact/" }}active{{ end }}">
                   LIÊN HỆ
                </a>
            </li>
        </ul>
    </nav>
</header>

    position: fixed;
    top: 0;

    background: rgba(255,255,255,0.9);

    border-bottom: 1px solid #eee;
}

.luxury-nav {
    max-width: 1400px;
    margin: auto;
    padding: 18px 6vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.luxury-logo a {
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    color: #202124;
}

.luxury-menu {
    display: flex;
    gap: 36px;
    list-style: none;
}

.luxury-menu a {
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #5f6368;

}

.luxury-menu a.active,
.luxury-menu a:hover {
